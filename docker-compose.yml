services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      DB_DSN: host=postgres port=5432 dbname=compliance user=compliance password=compliance
      QDRANT_URL: http://qdrant:6333
    env_file:
      - path: .env  # LLM API key; see .env.example
        required: false
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  uploads:
  pgdata:
  qdrant_data:
